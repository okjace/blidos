# BlidOS goes on one ext4 partition. On UEFI PCs it also needs an EFI system partition.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: EFI
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices: [ none ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]

partitionLayout:
  - name: "BlidOS"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%

# Android can't start from an encrypted partition.
enableLuksAutomatedPartitioning: false
