# BlidOS graphical installer: picks a partition, copies BlidOS onto it and sets up GRUB.
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id: copy
  module: shellprocess
  config: shellprocess_copy.conf
- id: bootloader
  module: shellprocess
  config: shellprocess_bootloader.conf

sequence:
- show:
  - welcome
  - partition
  - summary
- exec:
  - partition
  - mount
  - shellprocess@copy
  - shellprocess@bootloader
  - umount
- show:
  - finished

branding: blidos
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
