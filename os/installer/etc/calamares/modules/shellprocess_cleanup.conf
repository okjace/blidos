# Inside the new system: remove what only the live USB needs.
dontChroot: false
timeout: 600
script:
  - "apt-get -y purge calamares live-boot live-boot-initramfs-tools live-tools"
  - "apt-get -y autoremove --purge"
  - "rm -rf /etc/calamares /usr/lib/blidos-installer /etc/systemd/system/getty@tty1.service.d /root/.bash_profile"
  - "rm -f /etc/systemd/system/greetd.service.d/live.conf"
  - "-update-grub"
i18n:
  name: "Finishing BlidOS"
