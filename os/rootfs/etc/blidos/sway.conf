# BlidOS session: the home screen lives on workspace 1; apps (and Android) open full screen on workspace 2.
# Home (remote Home key, the Windows/Super key, or F1) always goes back to BlidOS.

default_border none
default_floating_border none
hide_edge_borders both
focus_on_window_activation focus
seat * hide_cursor 8000
# A loading screen until the home screen appears (BlidOS then sets a plain background).
output * bg /usr/share/blidos/loading.png fill #0F1424
include ~/.config/blidos/outputs.conf
input type:keyboard xkb_numlock enabled

# Rules run in order: everything goes to the apps workspace, then the home screen is put back on 1.
for_window [app_id=".*"] move container to workspace 2, workspace 2, fullscreen enable
for_window [class=".*"] move container to workspace 2, workspace 2, fullscreen enable
for_window [app_id="^blidos$"] move container to workspace 1, workspace 1, fullscreen enable
for_window [title="^BlidOS$"] move container to workspace 1, workspace 1, fullscreen enable

bindsym XF86HomePage workspace 1
bindsym F1 workspace 1
bindsym --release Super_L workspace 1
bindsym Mod4+q kill
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86PowerOff workspace 1

workspace 1
exec /usr/bin/blidos shell
exec /usr/lib/blidos/session-helper
# Controllers as a remote; started again if it ever stops.
exec sh -c 'while swaymsg -t get_version >/dev/null 2>&1; do /usr/lib/blidos/gamepad; sleep 3; done'
exec /usr/lib/blidos/start-android
# Screen off after 15 minutes idle; back to the profile picker after 30.
exec swayidle -w timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' timeout 1800 'swaymsg exit'
