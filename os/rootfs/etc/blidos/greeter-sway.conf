# The profile picker ("Who's watching?"). sway shows the BlidOS loading screen until the picker
# is up, so there's never a black screen; the session ends when someone signs in.
default_border none
default_floating_border none
hide_edge_borders both
seat * hide_cursor 3000
output * bg /usr/share/blidos/loading.png fill #0F1424
input type:keyboard xkb_numlock enabled
for_window [app_id=".*"] fullscreen enable
exec "/usr/bin/blidos greeter; swaymsg exit"
